name: lint

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        run: go mod download

      - name: Verify generated artifacts
        run: |
          make generate manifests
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Check formatting
        run: make fmt-check

